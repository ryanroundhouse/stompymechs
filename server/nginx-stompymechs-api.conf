# nginx: send the game's two requests to the service on the loopback. Two pieces, in two places.
#
# 1. In the http block (a file of its own in /etc/nginx/conf.d/ will do): one zone, so that no single address can
#    hammer the service. The service keeps its own limits as well; this one stops the noise before it gets there.

limit_req_zone $binary_remote_addr zone=stompymechs_api:1m rate=30r/m;

# 2. Inside the server block that serves stompymechs.graham.pub, beside the location that serves index.html:
#
#    location /api/ {
#        limit_req zone=stompymechs_api burst=10 nodelay;
#        limit_req_status 429;
#        client_max_body_size 16k;
#
#        proxy_pass http://127.0.0.1:8377;
#        proxy_http_version 1.1;
#        proxy_set_header Host $host;
#        # the service takes the caller's address from here, to rate-limit it (it is never stored), and refuses to
#        # read anything back to a request that carries either header. Set both: never pass on what a client sent.
#        proxy_set_header X-Real-IP $remote_addr;
#        proxy_set_header X-Forwarded-For $remote_addr;
#        proxy_connect_timeout 2s;
#        proxy_read_timeout 5s;
#        proxy_send_timeout 5s;
#    }
#
# Only /api/ is passed on. The service's other two paths, /stats and /feedback, answer on 127.0.0.1:8377 alone:
# do not add a location for them unless it is behind the dashboard's own login.
#
# Then:  sudo nginx -t && sudo systemctl reload nginx
#        curl -s https://stompymechs.graham.pub/api/health        ->  {"ok":true}
